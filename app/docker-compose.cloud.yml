services:
  db:
    volumes:
      - ${LUNAR_DATA_ROOT:?Set the mounted persistent data disk}/postgres:/var/lib/postgresql/data
  frontend:
    ports: !reset []
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      LUNAR_HOST: ${LUNAR_HOST:?Set the public host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LUNAR_DATA_ROOT}/caddy:/data
    depends_on: [frontend]
