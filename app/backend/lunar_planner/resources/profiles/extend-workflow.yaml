schema_version: lunar.planner.profile/v1
source_archive_version: "1.1"
workflow_id: catalog_aware_existing_workflow_extension
kind: planner_profile
status: planning_only_non_executing
mode: extend_existing_workflow
catalog_scope: selected_package_skills_and_workflows
surface_index: selected-package://surface
root_inputs: [workflow_reference, extension_objective, constraints, authority_envelope]
release_stage_id: release_review
stages:
  - id: baseline_inspection
    owner_skill: pipeline-design-refinement-planner
    owner_scope: planner
    inputs: [workflow_reference]
    outputs: [baseline_inspection]
    dependencies: []
    rule: Missing run evidence remains explicit.
  - id: workflow_reference_scan
    owner_skill: workflow-reference-scout
    owner_scope: planner
    inputs: [extension_objective, workflow_reference, baseline_inspection]
    outputs: [workflow_reference_scan]
    dependencies: [baseline_inspection]
    rule: Search all admitted workflow and skill surfaces.
  - id: semantic_reuse_review
    owner_skill: skill-reuse-critical-reasoner
    owner_scope: planner
    inputs: [extension_objective, constraints, workflow_reference_scan, baseline_inspection]
    outputs: [reuse_critical_packet]
    dependencies: [workflow_reference_scan]
    rule: Existing specialist skills remain mandatory companions when applicable.
  - id: capability_plan
    owner_skill: workflow-skill-gap-planner
    owner_scope: planner
    inputs: [extension_objective, constraints, reuse_critical_packet]
    outputs: [workflow_capability_plan]
    dependencies: [semantic_reuse_review]
    rule: Exhaust current Lunar reuse, then type unresolved obligations as universal, project-specific, adapter, or workflow-local without fabricating availability.
  - id: extension_plan
    owner_skill: pipeline-design-refinement-planner
    owner_scope: planner
    inputs: [workflow_reference, baseline_inspection, workflow_capability_plan]
    outputs: [pipeline_design_refinement_plan]
    dependencies: [capability_plan]
    rule: State preserved behavior, changed surfaces, tests, and rollback.
  - id: post_plan_reasoning_verification
    owner_skill: post-plan-evidence-grounding-verifier
    owner_scope: planner
    inputs: [pipeline_design_refinement_plan, authority_envelope]
    outputs: [post_plan_evidence_verification]
    dependencies: [extension_plan]
    rule: Bind a planning-only lunar.planner.post-plan-evidence-verification/v1 sidecar to the exact initial-plan digest; maximize deterministic and symbolic checks, preserve proportionate exploratory reasoning, and propose local repairs without mutating or rerouting the plan.
  - id: test_review
    owner_skill: post-plan-evidence-grounding-verifier
    owner_scope: planner
    inputs: [workflow_reference, pipeline_design_refinement_plan, post_plan_evidence_verification]
    outputs: [workflow_test_coverage_audit]
    dependencies: [extension_plan, post_plan_reasoning_verification]
    rule: Require matched consumer and regression coverage, including every blocking or repair-required post-plan verification obligation.
  - id: release_review
    owner_skill: closure-readiness-assessor
    owner_scope: planner
    inputs: [pipeline_design_refinement_plan, post_plan_evidence_verification, workflow_test_coverage_audit, authority_envelope]
    outputs: [planning_release_decision]
    dependencies: [extension_plan, post_plan_reasoning_verification, test_review]
    rule: Planning approval consumes the additive verification sidecar but is not implementation, evidence-validation, or execution authority.
