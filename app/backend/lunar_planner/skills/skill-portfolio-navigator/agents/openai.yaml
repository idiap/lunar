interface:
  display_name: Skill Portfolio Navigator
  short_description: Navigate the full installed skill portfolio from a clean context,
    shrinking a…
  default_prompt: Use $skill-portfolio-navigator to navigate the full installed skill
    portfolio from a clean context, shrinking a large capability space into the few
    workflow-relevant skills, routes, and blind spots that should drive reuse before
    new skills are proposed from the contract-defined inputs, producing the documented
    output artifact; do not exceed supplied evidence or the skill's declared authority,
    and return needs_input, blocked, or the documented abstention state when prerequisites
    are absent.
